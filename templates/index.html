<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI SQL TRANSLATOR</title>
    <link rel="stylesheet" href="{{url_for('static',filename='css/style1.css')}}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <video id="video-background" autoplay loop muted playsinline>
        <source src="{{url_for('static',filename='video/video.mp4')}}" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="page-wrapper">
        <div class="header">
            <b>AI DRIVEN SQL INSIGHT</b>
        </div>

        <div class="subtitle">
            <b>NATURAL LANGUAGE TO SQL QUERY</b>
        </div>

        <form method="post" action="/">
            <div class="box">
                <input type="text" name="question" value="{{ question }}" placeholder="Enter your question here...">
            </div>
            <div class="generate">
                <button type="submit">Generate SQL Query</button>
            </div>
        </form>

        <div class="process">
            <input type="text" value="{{ processed_text }}" placeholder="Generated SQL Query will appear here..." readonly>
        </div>

        <div class="note">
            ⚠️ <strong>Demo Notice:</strong> This is a demo model. Please ask questions related to
            <span>students</span>, <span>classes</span>, <span>departments</span>, or similar academic topics
            for best results.
        </div>
    </div>
</body>
</html>
